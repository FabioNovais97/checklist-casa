<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Novo Lar | Checklist</title>
    <link rel="apple-touch-icon" href="icon-enxoval.png">
    <meta name="apple-mobile-web-app-title" content="Enxoval 2026">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/styles.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 Lista de Enxoval</h1>
            <p>Planejamento para o nosso casamento 2026</p>
        </header>

        <section class="add-item">
            <input type="text" id="itemInput" placeholder="O que precisamos comprar?">
            <select id="categoryInput">
                <option value="Cozinha">Cozinha</option>
                <option value="Sala">Sala</option>
                <option value="Quarto">Quarto</option>
                <option value="Banheiro">Banheiro</option>
                <option value="Lavanderia">Lavanderia</option> </select>
            <button onclick="addItem()">Adicionar</button>
        </section>

        <section class="list-container">
            <div class="filter-group" style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <label for="filterCategory">🔍 Filtrar por:</label>
                <select id="filterCategory" onchange="carregarLista()">
                    <option value="Todos">Todos</option>
                    <option value="Cozinha">Cozinha</option>
                    <option value="Sala">Sala</option>
                    <option value="Quarto">Quarto</option>
                    <option value="Banheiro">Banheiro</option>
                    <option value="Lavanderia">Lavanderia</option> </select>
            </div>
            <ul id="shoppingList">
                </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
